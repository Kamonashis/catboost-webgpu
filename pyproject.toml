[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "catboost-webgpu"
version = "0.1.0"
description = "WebGPU-accelerated CatBoost for Python, written in Rust with automatic CPU fallback"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
urls = { repository = "https://github.com/Kamonashis/catboost-webgpu" }
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
    "scikit-learn>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pandas>=1.3",
]

[tool.maturin]
module-name = "catboost_webgpu._core"
python-source = "python"
features = ["python"]
