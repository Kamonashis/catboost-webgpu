[package]
name = "catboost-webgpu"
version = "0.1.0"
edition = "2021"
authors = ["catboost-webgpu contributors"]
description = "High-performance CatBoost implementation in Rust with WebGPU acceleration and automatic CPU fallback"
license = "Apache-2.0"

[lib]
name = "catboost_webgpu_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.24", features = ["extension-module", "abi3-py311"], optional = true }
wgpu = { version = "29.0", default-features = true }
bytemuck = { version = "1.25", features = ["derive"] }
futures = "0.3"
rayon = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
rand_distr = "0.4"
thiserror = "2.0"

[features]
default = []
python = ["pyo3"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
